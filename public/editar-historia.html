<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Editar Historia de Pácora</title>

  <link rel="stylesheet" href="css/styles.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #f7f4ec, #eef5ed);
      font-family: Arial, Helvetica, sans-serif;
    }

    .contenedor {
      width: 90%;
      max-width: 1000px;
      margin: 40px auto;
      background: white;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(0,0,0,.12);
      border-top: 6px solid #c9a227;
    }

    h1 {
      margin-top: 0;
      color: #235437;
    }

    textarea {
      width: 100%;
      min-height: 450px;
      padding: 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      line-height: 1.6;
      resize: vertical;
    }

    button {
      margin-top: 20px;
      padding: 13px 22px;
      border: none;
      border-radius: 10px;
      background: #235437;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #2f6f4e;
    }

    #mensaje {
      margin-top: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <main class="contenedor">
    <h1>Editar Historia de Pácora</h1>

    <textarea
    id="editor"
    placeholder="Escribe aquí el contenido histórico de Pácora"
></textarea>

    <button id="guardar">
      Guardar cambios
    </button>

    <div id="mensaje"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/editar-historia.js?v=2"></script>

</body>
</html>
