<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ingresar | Cátedra de la Pacoreñidad</title>

    <link rel="stylesheet" href="css/styles.css">

    <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 25px;
        background:
            linear-gradient(rgba(247, 244, 236, 0.92), rgba(238, 245, 237, 0.94)),
            url("images/fondo-login.jpg");
        background-size: cover;
        background-position: center;
        font-family: Arial, Helvetica, sans-serif;
    }

    .login-card {
        width: 100%;
        max-width: 460px;
        background: rgba(255, 255, 255, 0.96);
        border-radius: 24px;
        padding: 42px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.15);
        border-top: 6px solid #c9a227;
    }

    .logo {
        width: 175px;
        max-width: 100%;
        height: auto;
        display: block;
        margin: 0 auto 12px;
    }

    h1 {
        text-align: center;
        color: #235437;
        margin: 5px 0 8px;
        font-size: 38px;
        line-height: 1.12;
        font-family: Georgia, "Times New Roman", serif;
    }

    p {
        text-align: center;
        color: #666;
        margin: 0 0 30px;
        font-size: 17px;
    }

    input {
        width: 100%;
        padding: 15px 16px;
        margin-bottom: 16px;
        border-radius: 12px;
        border: 1px solid #d3d3d3;
        font-size: 16px;
        outline: none;
        transition: 0.2s;
    }

    input:focus {
        border-color: #235437;
        box-shadow: 0 0 0 3px rgba(35, 84, 55, 0.12);
    }

    button {
        width: 100%;
        padding: 15px;
        background: #235437;
        color: white;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-size: 17px;
        font-weight: bold;
        transition: 0.2s;
    }

    button:hover {
        background: #2f6f4e;
        transform: translateY(-1px);
    }

    .secondary {
        margin-top: 12px;
        background: white;
        color: #6b3a0a;
        border: 1px solid #e2e2e2;
    }

    .secondary:hover {
        background: #f8f5ef;
        color: #5a2f05;
    }

    #mensaje {
        text-align: center;
        margin-top: 18px;
        color: #c0392b;
        font-weight: bold;
        min-height: 22px;
    }

    a {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #235437;
        text-decoration: none;
        font-size: 16px;
    }

    a:hover {
        text-decoration: underline;
    }

    @media (max-width: 520px) {
        body {
            padding: 14px;
            align-items: flex-start;
        }

        .login-card {
            margin-top: 20px;
            padding: 30px 24px;
            border-radius: 20px;
        }

        .logo {
            width: 150px;
        }

        h1 {
            font-size: 31px;
        }
    }
</style>

</head>

<body>

<div class="login-card">

<img
    src="images/logo.png"
    class="logo"
    alt="Logo de la Cátedra de la Pacoreñidad"
>

<h1>Cátedra de la Pacoreñidad</h1>

<p>Acceso para colaboradores</p>

<input
type="email"
id="email"
placeholder="Correo electrónico">

<input
type="password"
id="password"
placeholder="Contraseña">

<button onclick="login()">

Ingresar

</button>


<div id="mensaje"></div>

<a href="index.html">

← Volver al sitio

</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>

</body>

</html>
