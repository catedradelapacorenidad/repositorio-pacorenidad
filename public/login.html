<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ingresar | Cátedra de la Pacoreñidad</title>

    <link rel="stylesheet" href="css/styles.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            background:
                linear-gradient(
                    rgba(247, 244, 236, 0.92),
                    rgba(238, 245, 237, 0.94)
                ),
                url("images/fondo-login.jpg");
            background-size: cover;
            background-position: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 460px;
            padding: 42px;
            background: rgba(255, 255, 255, 0.96);
            border-top: 6px solid #c9a227;
            border-radius: 24px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.15);
        }

        .logo {
            display: block;
            width: 175px;
            max-width: 100%;
            height: auto;
            margin: 0 auto 12px;
        }

        h1 {
            margin: 5px 0 8px;
            color: #235437;
            text-align: center;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 38px;
            line-height: 1.12;
        }

        .descripcion {
            margin: 0 0 30px;
            color: #666;
            text-align: center;
            font-size: 17px;
        }

        label {
            display: block;
            margin: 0 0 7px;
            color: #3b332d;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 15px 16px;
            margin-bottom: 16px;
            border: 1px solid #d3d3d3;
            border-radius: 12px;
            outline: none;
            font-size: 16px;
            transition: 0.2s;
        }

        input:focus {
            border-color: #235437;
            box-shadow: 0 0 0 3px rgba(35, 84, 55, 0.12);
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #235437;
            color: #fff;
            cursor: pointer;
            font-size: 17px;
            font-weight: 700;
            transition: 0.2s;
        }

        button:hover {
            background: #2f6f4e;
            transform: translateY(-1px);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.65;
            transform: none;
        }

        .enlace-recuperacion {
            display: block;
            margin: 14px 0 0;
            color: #6b3a0a;
            text-align: center;
            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
        }

        .enlace-recuperacion:hover {
            text-decoration: underline;
        }

        #mensaje {
            min-height: 22px;
            margin-top: 18px;
            color: #c0392b;
            text-align: center;
            font-weight: 700;
            line-height: 1.4;
        }

        .volver {
            display: block;
            margin-top: 20px;
            color: #235437;
            text-align: center;
            text-decoration: none;
            font-size: 16px;
        }

        .volver:hover {
            text-decoration: underline;
        }

        @media (max-width: 520px) {
            body {
                align-items: flex-start;
                padding: 14px;
            }

            .login-card {
                margin-top: 20px;
                padding: 30px 24px;
                border-radius: 20px;
            }

            .logo {
                width: 150px;
            }

            h1 {
                font-size: 31px;
            }
        }
    </style>
</head>

<body>

    <main class="login-card">

        <img
            src="images/logo.png"
            class="logo"
            alt="Logo de la Cátedra de la Pacoreñidad"
        >

        <h1>Cátedra de la Pacoreñidad</h1>

        <p class="descripcion">
            Acceso para colaboradores
        </p>

        <form id="form-login">

            <label for="email">Correo electrónico</label>

            <input
                type="email"
                id="email"
                placeholder="Correo electrónico"
                autocomplete="email"
                required
            >

            <label for="password">Contraseña</label>

            <input
                type="password"
                id="password"
                placeholder="Contraseña"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="btn-ingresar">
                Ingresar
            </button>

        </form>

        <a
            href="#"
            id="recuperar-contrasena"
            class="enlace-recuperacion"
        >
            ¿Olvidaste tu contraseña?
        </a>

        <div
            id="mensaje"
            role="status"
            aria-live="polite"
        ></div>

        <a href="index.html" class="volver">
            ← Volver al sitio
        </a>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>

    <script>
        const formularioLogin =
            document.getElementById("form-login");

        const emailInput =
            document.getElementById("email");

        const passwordInput =
            document.getElementById("password");

        const botonIngresar =
            document.getElementById("btn-ingresar");

        const enlaceRecuperacion =
            document.getElementById("recuperar-contrasena");

        const mensaje =
            document.getElementById("mensaje");

        function mostrarMensaje(texto, color) {
            mensaje.textContent = texto;
            mensaje.style.color = color;
        }

        formularioLogin.addEventListener(
            "submit",
            async function (evento) {

                evento.preventDefault();

                const email = emailInput.value.trim();
                const password = passwordInput.value;

                if (!email || !password) {
                    mostrarMensaje(
                        "Escribe el correo y la contraseña.",
                        "#b52b2b"
                    );
                    return;
                }

                botonIngresar.disabled = true;
                botonIngresar.textContent = "Ingresando...";

                mostrarMensaje(
                    "Verificando credenciales...",
                    "#805019"
                );

                try {
                    const { data, error } =
                        await supabaseClient.auth.signInWithPassword({
                            email,
                            password
                        });

                    if (error) {
                        throw error;
                    }

                    if (!data.session) {
                        throw new Error(
                            "No fue posible iniciar la sesión."
                        );
                    }

                    mostrarMensaje(
                        "Acceso correcto. Redirigiendo...",
                        "#247a3c"
                    );

                    window.location.href = "admin.html";

                } catch (error) {
                    console.error(
                        "Error al iniciar sesión:",
                        error
                    );

                    mostrarMensaje(
                        "Correo o contraseña incorrectos.",
                        "#b52b2b"
                    );

                    botonIngresar.disabled = false;
                    botonIngresar.textContent = "Ingresar";
                }
            }
        );

        enlaceRecuperacion.addEventListener(
            "click",
            async function (evento) {

                evento.preventDefault();

                const email = emailInput.value.trim();

                if (!email) {
                    mostrarMensaje(
                        "Primero escribe tu correo electrónico.",
                        "#b52b2b"
                    );

                    emailInput.focus();
                    return;
                }

                enlaceRecuperacion.style.pointerEvents = "none";
                enlaceRecuperacion.style.opacity = "0.6";

                mostrarMensaje(
                    "Enviando correo de recuperación...",
                    "#805019"
                );

                try {
                    const redirectTo =
                        window.location.origin +
                        "/restablecer-contrasena.html";

                    const { error } =
                        await supabaseClient.auth
                            .resetPasswordForEmail(
                                email,
                                {
                                    redirectTo: redirectTo
                                }
                            );

                    if (error) {
                        throw error;
                    }

                    mostrarMensaje(
                        "Correo enviado. Revisa tu bandeja de entrada y la carpeta de spam.",
                        "#247a3c"
                    );

                } catch (error) {
                    console.error(
                        "Error al solicitar recuperación:",
                        error
                    );

                    mostrarMensaje(
                        "No fue posible enviar el correo de recuperación.",
                        "#b52b2b"
                    );

                } finally {
                    enlaceRecuperacion.style.pointerEvents = "auto";
                    enlaceRecuperacion.style.opacity = "1";
                }
            }
        );
    </script>

</body>

</html>
